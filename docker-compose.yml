services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      [
        "mongosh",
        "mongodb://mongo:27017",
        "--eval",
        "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }",
      ]

  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      RAZORPAY_TEST_KEY_ID: ${RAZORPAY_TEST_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MONGO_URI: mongodb://mongo:27017/lumoura?replicaSet=rs0
      MONGO_DB_NAME: lumoura
      SUBSCRIPTION_PLAN_AMOUNT: ${SUBSCRIPTION_PLAN_AMOUNT:-99900}
      SUBSCRIPTION_PLAN_CREDITS: ${SUBSCRIPTION_PLAN_CREDITS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      mongo-init:
        condition: service_completed_successfully

volumes:
  mongo_data:
